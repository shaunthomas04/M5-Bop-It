<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-label="M5 Bop-It demo card">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#101827"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="800" height="420" fill="url(#bg)" rx="28"/>
  <text x="64" y="72" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#f8fafc">M5 Bop-It</text>
  <text x="64" y="108" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#cbd5e1">Bluetooth party challenge</text>

  <g filter="url(#shadow)">
    <rect x="64" y="150" width="330" height="200" rx="18" fill="#111827"/>
    <rect x="82" y="168" width="294" height="164" rx="12" fill="url(#screen)"/>

    <circle cx="160" cy="240" r="40" fill="#ef4444"/>
    <rect x="243" y="218" width="80" height="14" rx="7" fill="#fbbf24"/>
    <rect x="240" y="206" width="88" height="38" rx="8" fill="#facc15" opacity="0.35"/>
    <g transform="translate(233 257)">
      <rect x="0" y="0" width="106" height="18" rx="9" fill="#fbbf24"/>
      <rect x="71" y="-3" width="58" height="24" rx="10" fill="#f59e0b"/>
    </g>

    <g transform="translate(100 260)">
      <circle cx="0" cy="0" r="26" fill="#10b981"/>
      <circle cx="0" cy="0" r="12" fill="#ffffff" opacity="0.9"/>
    </g>

    <text x="83" y="196" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0f172a">BOP IT</text>
  </g>

  <g>
    <rect x="462" y="150" width="270" height="170" rx="18" fill="#1f2937" opacity="0.95"/>
    <text x="492" y="205" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#f8fafc">Round 1</text>
    <text x="492" y="245" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#93c5fd">Player 2</text>
    <text x="492" y="280" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#f59e0b">SHAKE IT</text>
    <text x="492" y="308" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#cbd5e1">Timer: 3.2s</text>
  </g>

  <g>
    <circle cx="640" cy="92" r="20" fill="#22c55e"/>
    <circle cx="696" cy="92" r="20" fill="#fbbf24"/>
    <circle cx="752" cy="92" r="20" fill="#ef4444"/>
  </g>
</svg>
